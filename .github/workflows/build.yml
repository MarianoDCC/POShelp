name: Build installer

# Builds the Windows installer from source on every push, and publishes it as a
# release asset so there is always a plain download link — no GitHub account, no
# digging through the Actions UI. This is the artifact that gets code-signed
# once signing is in place.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Read version from package.json
        id: pkg
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build NSIS installer
        run: npm run dist:win

      # Stable filename. electron-builder names it after the product and version
      # ("TuResto Impresión Setup 3.7.0.exe") — a space and an accent in a URL,
      # and it changes every release, so nothing can link to it permanently.
      - name: Normalise the installer filename
        shell: bash
        run: |
          mkdir -p out
          cp "$(ls dist/*.exe | head -1)" "out/TuResto-Agente-Setup.exe"
          ls -la out

      # NO se sube artifact, a proposito (2026-09-19).
      #
      # Habia un upload-artifact del instalador sin retention-days, o sea que
      # GitHub lo guardaba 90 dias, y este workflow corre en CADA push a main.
      # El .exe pesa 77 MB: quedaron 4 copias = 310 MB ocupados.
      #
      # El cupo de almacenamiento de Actions es DE LA CUENTA, no del repo, y
      # son 500 MB en el plan personal. Lo que se rompio por eso fue el backup
      # de la base de TuResto, que vive en otro repositorio: tomaba el dump
      # bien y GitHub se negaba a guardarlo. Seis dias sin una sola copia de
      # las bases de los bares por culpa de un instalador.
      #
      # Y era una copia que no servia para nada: el paso de abajo publica el
      # MISMO archivo como release asset, que es de donde lo baja la gente por
      # el link fijo. El artifact ni se podia bajar sin cuenta de GitHub.

      # Published on pushes to main so the latest build is always downloadable
      # at a fixed URL:
      #   https://github.com/OWNER/REPO/releases/latest/download/TuResto-Agente-Setup.exe
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/TuResto-Agente-Setup.exe --clobber
          else
            gh release create "$TAG" out/TuResto-Agente-Setup.exe \
              --title "$TAG" \
              --notes "Built from ${{ github.sha }} by GitHub Actions."
          fi
